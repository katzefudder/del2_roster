name: DEL2-Kader aktualisieren

on:
  push:
    branches:
      - main
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-del2-roster
  cancel-in-progress: false

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Copilot CLI installieren
        run: npm install --global @github/copilot

      - name: Aktuelle Kader ermitteln
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          update_roster() {
            local league_name="$1"
            local teams_file="$2"
            local roster_file="$3"

            {
              cat rules.md
              printf '\n\nLiga: %s\n' "$league_name"
              printf '\nTeam-Quellen und Kürzel:\n'
              cat "$teams_file"
              printf '\n\nArbeitsauftrag:\n'
              printf '%s\n' 'Rufe ausschließlich die angegebenen offiziellen Quellen auf.'
              printf '%s\n' "Lies $roster_file als Ergebnis des vorherigen Laufs."
              printf '%s\n' "Erstelle oder überschreibe ausschließlich $roster_file mit dem vollständigen Ergebnis."
              printf '%s\n' 'Enthält die Datei nur einen Initialisierungshinweis, behandle sie als keinen vorherigen Lauf.'
              printf '%s\n' 'Gib keine Erläuterung im Terminal aus und ändere keine anderen Dateien.'
            } > /tmp/copilot-prompt.md
            copilot --prompt "$(cat /tmp/copilot-prompt.md)" --allow-all \
              --no-ask-user --silent --secret-env-vars=GH_TOKEN
          }

          update_roster "DEL2" "teams_del2.md" "roster_del2.txt"
          update_roster "DEL" "teams_del.md" "roster_del.txt"

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roster_del2.txt roster_del.txt

          if git diff --cached --quiet; then
            echo "Keine Kaderänderungen gefunden."
            exit 0
          fi

          git commit -m "chore: DEL2-Kader aktualisieren"
          git push
