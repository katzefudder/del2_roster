name: DEL-Kader aktualisieren

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-del2-roster.yml
      - rules.md
      - teams_del.md
      - teams_del2.md
      - teams_oberliga.md
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-del2-roster
  cancel-in-progress: false

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Copilot CLI installieren
        run: npm install --global @github/copilot

      - name: Aktuelle Kader ermitteln
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          {
            cat rules.md
            printf '\n\nDEL2: Kürzel und Quellen aus teams_del2.md; Ergebnis in roster_del2.txt.\n'
            cat teams_del2.md
            printf '\n\nDEL: Kürzel und Quellen aus teams_del.md; Ergebnis in roster_del.txt.\n'
            cat teams_del.md
            printf '\n\nOberliga Nord und Süd: Quellen aus teams_oberliga.md; Ergebnis in roster_oberliga.txt.\n'
            cat teams_oberliga.md
            printf '\n\nArbeitsauftrag:\n'
            printf '%s\n' 'Aktualisiere alle drei Ziel-Dateien in einer Sitzung.'
            printf '%s\n' 'Lies die jeweilige Ziel-Datei als Ergebnis des vorherigen Laufs.'
            printf '%s\n' 'Enthält sie nur einen Initialisierungshinweis, behandle sie als keinen vorherigen Lauf.'
            printf '%s\n' 'Für roster_oberliga.txt prüfe alle Teams beider angegebenen Oberliga-Staffeln über deb-online.live.'
            printf '%s\n' 'Nutze die auf deb-online.live angezeigten Teamkürzel; trenne die Staffeln mit den Überschriften Oberliga Nord und Oberliga Süd.'
            printf '%s\n' 'Ändere ausschließlich roster_del2.txt, roster_del.txt und roster_oberliga.txt; gib keine Erläuterung im Terminal aus.'
          } > /tmp/copilot-prompt.md
          copilot --prompt "$(cat /tmp/copilot-prompt.md)" --allow-all \
            --no-ask-user --silent --secret-env-vars=GH_TOKEN

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roster_del2.txt roster_del.txt roster_oberliga.txt

          if git diff --cached --quiet; then
            echo "Keine Kaderänderungen gefunden."
            exit 0
          fi

          git commit -m "chore: Eishockey-Kader aktualisieren"
          git push
