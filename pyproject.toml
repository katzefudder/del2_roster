[project]
name = "del2-roster"
version = "0.2.0"
description = "Roster files (DEL, DEL2, Oberliga) for Captioner, scraped from the official league sites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
